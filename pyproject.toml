[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sm-aae"
version = "0.1.0"
description = "Attested Action Envelope — a signed, per-agent-chained record of a pre-action authorization verdict"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "labs.stellarminds.ai" }]
keywords = [
    "nanda",
    "attestation",
    "authorization",
    "agent",
    "ed25519",
    "audit",
    "provenance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=41.0",
]

[project.urls]
Homepage = "https://labs.stellarminds.ai"
Repository = "https://github.com/Sharathvc23/sm-aae"
Documentation = "https://github.com/Sharathvc23/sm-aae/blob/main/docs/WALKTHROUGH.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.0",
    "coverage>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["sm_aae"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/dist"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["sm_aae"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["sm_aae"]

[tool.coverage.report]
show_missing = true
fail_under = 90
